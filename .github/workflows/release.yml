name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["downloads/**", ".shadow/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_dev:
        description: Publish dev-build from main
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - id: plan
        env:
          PUBLISH_DEV: ${{ inputs.publish_dev }}
        run: |
          channel=none
          publish=false
          version="dev-${GITHUB_SHA::7}-$GITHUB_RUN_NUMBER-$GITHUB_RUN_ATTEMPT"
          tag=dev-build
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            channel=stable
            publish=true
            version="$GITHUB_REF_NAME"
            tag="$GITHUB_REF_NAME"
          elif [ "$GITHUB_REF" = refs/heads/main ] && { [ "$GITHUB_EVENT_NAME" = push ] || [ "$PUBLISH_DEV" = true ]; }; then
            channel=dev
            publish=true
          fi
          {
            echo "channel=$channel"
            echo "publish=$publish"
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
            target: x86_64-unknown-linux-gnu
            experimental: false
          - os: windows-latest
            name: windows-x86_64
            target: x86_64-pc-windows-msvc
            experimental: false
          - os: macos-15
            name: macos-aarch64
            target: aarch64-apple-darwin
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test release tooling
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s scripts/tests -v
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libfontconfig1-dev
      - name: Build independent App and CLI binaries
        env:
          EORZEA_BUILD_VERSION: ${{ needs.plan.outputs.version }}
          EORZEA_BUILD_CHANNEL: ${{ needs.plan.outputs.channel }}
          EORZEA_BUILD_COMMIT: ${{ github.sha }}
          EORZEA_BUILD_NUMBER: ${{ github.run_number }}
          EORZEA_BUILD_ATTEMPT: ${{ github.run_attempt }}
          EORZEA_DISTRIBUTION: ${{ needs.plan.outputs.publish == 'true' && 'portable' || 'source' }}
        run: cargo build --release --locked --target ${{ matrix.target }} -p eorzea-app -p eorzea-cli
      - name: Package App and CLI separately
        shell: bash
        env:
          BUILD_VERSION: ${{ needs.plan.outputs.version }}
          BUILD_PLATFORM: ${{ matrix.name }}
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          python scripts/release.py package --target "target/$BUILD_TARGET/release" \
            --platform "$BUILD_PLATFORM" --version "$BUILD_VERSION" --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.dmg
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Update rolling Dev tag after builds succeed
        if: needs.plan.outputs.channel == 'dev'
        uses: actions/github-script@v7
        with:
          script: |
            const ref = 'tags/dev-build';
            try {
              await github.rest.git.getRef({ ...context.repo, ref });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({ ...context.repo, ref: `refs/${ref}`, sha: context.sha });
              return;
            }
            await github.rest.git.updateRef({ ...context.repo, ref, sha: context.sha, force: true });
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.plan.outputs.version }}
          prerelease: ${{ needs.plan.outputs.channel == 'dev' || contains(github.ref_name, '-') }}
          make_latest: ${{ needs.plan.outputs.channel == 'stable' && !contains(github.ref_name, '-') && 'true' || 'false' }}
          generate_release_notes: ${{ needs.plan.outputs.channel == 'stable' }}
          files: dist/*
          fail_on_unmatched_files: true
          body: |
            App（GUI）和 eoz（CLI）独立打包，无需同时安装。
            Windows 解压 ZIP，Linux 解压 tar.gz 后运行。
            macOS App 使用 DMG 拖拽安装，CLI 使用 tar.gz；macOS 尚未真机验证，未签名或公证。
            Dev 附件按构建区分，下载清单展示最新构建，旧附件至少保留 30 天。
            Commit: ${{ github.sha }}

  downloads:
    name: Publish download manifests and TOS mirror
    needs: [plan, release]
    if: needs.plan.outputs.publish == 'true' && (needs.plan.outputs.channel == 'dev' || !contains(github.ref_name, '-'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: eorzea-download-state
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      CHANNEL: ${{ needs.plan.outputs.channel }}
      BUILD_VERSION: ${{ needs.plan.outputs.version }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || 'deploy@82.156.196.54' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: publication
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read published release
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > release-info.json
          release_id=$(jq -r .id release-info.json)
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" > "$RUNNER_TEMP/release-assets.json"
          jq --slurpfile pages "$RUNNER_TEMP/release-assets.json" '.assets = ($pages[0] | add)' release-info.json > "$RUNNER_TEMP/release-info-full.json"
          mv "$RUNNER_TEMP/release-info-full.json" release-info.json
      - name: Generate GitHub-only manifest
        run: |
          python3 scripts/release.py manifest --repo publication --directory release-assets \
            --channel "$CHANNEL" --source github --release release-info.json \
            --commit "$GITHUB_SHA" --version "$BUILD_VERSION" --build "$GITHUB_RUN_NUMBER"
      - name: Commit GitHub download state
        working-directory: publication
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/github.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update GitHub App downloads'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Install Rust for Shadow
        uses: dtolnay/rust-toolchain@stable
      - name: Build pinned Shadow CLI
        run: cargo install --git https://github.com/AzurIce/shadow --rev 7a357b12984e2f13aab7259391e98a729d99e67f --locked -j 2
      - name: Stage current channel packages
        run: python3 scripts/release.py stage --repo publication --directory release-assets --channel "$CHANNEL"
      - name: Publish mirror and verify refs
        env:
          TOS_ACCESS_KEY: ${{ secrets.TOS_ACCESS_KEY }}
          TOS_SECRET_KEY: ${{ secrets.TOS_SECRET_KEY }}
          TOS_SECURITY_TOKEN: ${{ secrets.TOS_SECURITY_TOKEN }}
        run: |
          shadow -C publication restore
          shadow -C publication publish --attachment
          shadow -C publication check --remote
      - name: Generate TOS-only manifest
        run: |
          python3 scripts/release.py manifest --repo publication --directory release-assets \
            --channel "$CHANNEL" --source tos --release release-info.json \
            --commit "$GITHUB_SHA" --version "$BUILD_VERSION" --build "$GITHUB_RUN_NUMBER"
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Atomically publish server manifest
        run: |
          rsync -t --chmod=F644 publication/downloads/tos.json "$DEPLOY_HOST:eorzea.json.$GITHUB_RUN_ID.tmp"
          # shellcheck disable=SC2029
          ssh "$DEPLOY_HOST" "publish-manifest eorzea.json.$GITHUB_RUN_ID.tmp"
      - name: Commit mirror refs and manifest
        working-directory: publication
        run: |
          git add .shadow/refs/published downloads/tos.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update TOS App downloads and Shadow refs'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Release superseded TOS objects after publishing
        env:
          TOS_ACCESS_KEY: ${{ secrets.TOS_ACCESS_KEY }}
          TOS_SECRET_KEY: ${{ secrets.TOS_SECRET_KEY }}
          TOS_SECURITY_TOKEN: ${{ secrets.TOS_SECURITY_TOKEN }}
        run: shadow -C publication free --keep-at origin/main --delete
      - name: Retire old Dev attachments after publishing
        if: needs.plan.outputs.channel == 'dev'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: release } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag: 'dev-build' });
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { ...context.repo, release_id: release.id, per_page: 100 });
            const cutoff = Date.now() - 30 * 86400000;
            const fs = require('fs');
            const current = new Set(fs.readdirSync('release-assets'));
            for (const asset of assets) {
              if (!current.has(asset.name) && Date.parse(asset.created_at) < cutoff) {
                await github.rest.repos.deleteReleaseAsset({ ...context.repo, asset_id: asset.id });
              }
            }
